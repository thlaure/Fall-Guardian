name: fall_guardian
description: PSP-aware fall detection and family alert app.

publish_to: 'none'

version: 1.0.0+8

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  # GPS location
  geolocator: ^14.1.2

  # Local persistence
  shared_preferences: ^2.5.6

  # Local notifications (countdown alert)
  flutter_local_notifications: ^21.0.0

  # UUID for fall event IDs
  uuid: ^4.6.0

  # Date formatting
  intl: ^0.20.2

  # Backend API calls
  http: ^1.2.1

  # Material widgets and localizations; replaces package:flutter/material.dart
  # (deprecated since Flutter 3.47) and the flutter_localizations delegates.
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
