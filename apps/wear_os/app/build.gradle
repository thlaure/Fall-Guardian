plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def releaseSigningProperties = new Properties()
def releaseSigningFile = rootProject.file("keystore.properties")
if (releaseSigningFile.exists()) {
    releaseSigningFile.withInputStream { releaseSigningProperties.load(it) }
}

def signingValue = { String propertyKey, String envKey ->
    def propertyValue = releaseSigningProperties.getProperty(propertyKey)
    propertyValue?.trim() ? propertyValue : System.getenv(envKey)
}

def releaseStoreFile = signingValue("storeFile", "ANDROID_KEYSTORE_PATH")
def releaseStorePassword = signingValue("storePassword", "ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = signingValue("keyAlias", "ANDROID_KEY_ALIAS")
def releaseKeyPassword = signingValue("keyPassword", "ANDROID_KEY_PASSWORD")
def releaseSigningConfigured = [
    releaseStoreFile,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword
].every { it != null && !it.trim().isEmpty() }

android {
    namespace 'com.fallguardian'
    compileSdk 34

    defaultConfig {
        applicationId "com.fallguardian"
        minSdk 28  // Wear OS 2.0+
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            manifestPlaceholders = [debugAutomationEnabled: "true"]
        }
        release {
            manifestPlaceholders = [debugAutomationEnabled: "false"]
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

def explicitReleaseArtifactRequested = gradle.startParameter.taskNames.any {
    def task = it.toLowerCase()
    task.endsWith("assemblerelease") ||
        task.endsWith("bundlerelease") ||
        task.endsWith("installrelease")
}
if (explicitReleaseArtifactRequested && !releaseSigningConfigured) {
    throw new GradleException(
        "Release signing is not configured. Set keystore.properties or " +
            "ANDROID_KEYSTORE_PATH / ANDROID_KEYSTORE_PASSWORD / " +
            "ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD. Phone and Wear OS " +
            "must use the same signing key."
    )
}

dependencies {
    // Wear OS Compose
    implementation "androidx.wear.compose:compose-material:1.3.0"
    implementation "androidx.compose.material:material-icons-extended:1.5.4"
    implementation "androidx.wear.compose:compose-foundation:1.3.0"
    implementation "androidx.activity:activity-compose:1.8.2"

    // Wearable Data Layer (for sending to phone)
    implementation "com.google.android.gms:play-services-wearable:18.1.0"

    // Core
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"

    // Unit tests (JVM, no Android dependencies needed for FallAlgorithm)
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit:1.9.22"
}
