name: Assisted Mobile CI

on:
  push:
    branches:
      - main
    paths:
      - apps/assisted_mobile/**
      - .github/workflows/assisted-mobile-ci.yaml
  pull_request:
    branches:
      - main
  workflow_dispatch: ~

concurrency:
  group: assisted-mobile-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect assisted mobile changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- \
            apps/assisted_mobile \
            .github/workflows/assisted-mobile-ci.yaml; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Assisted Mobile Checks
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/assisted_mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
          cache-dependency-path: apps/assisted_mobile/android/**/*.gradle*

      - name: Install dependencies
        run: flutter pub get

      - name: Run deterministic quality checks
        run: make quality

      - name: Run assisted Android native tests and lint
        working-directory: apps/assisted_mobile/android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug

      - name: Build Android APK
        run: make build-android

  required-quality:
    name: Assisted Mobile Quality
    needs:
      - changes
      - quality
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify assisted mobile result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
        run: |
          test "$CHANGES_RESULT" = "success"
          if [ "$RELEVANT" = "true" ]; then
            test "$QUALITY_RESULT" = "success"
          else
            test "$QUALITY_RESULT" = "skipped"
          fi
