name: Deploy API

# Production deploys only run after "API CI" succeeded for a push to main, and
# always deploy the exact commit that CI validated (workflow_run.head_sha).
#
# Images are tagged with the immutable commit SHA. Manual runs are
# rollback-only: run this workflow from `main` with `image_sha` set to a
# previously built commit SHA; the build is skipped and that existing image is
# redeployed. Manual runs from other branches, or without `image_sha`, are
# rejected so nothing reaches production without passing API CI on main. Database
# migrations are never rolled back, so they must be backward compatible
# (expand/contract). See backend/api/docs/OVH_GITHUB_ACTIONS_DEPLOYMENT.md.

on:
  workflow_run:
    workflows: [API CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_sha:
        description: >-
          Rollback (required): full 40-character commit SHA of an already
          published image to redeploy. Run from main.
        required: true
        type: string

concurrency:
  group: api-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fall-guardian-api

jobs:
  resolve:
    name: Resolve deploy target
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      rollback: ${{ steps.target.outputs.rollback }}
    steps:
      - name: Resolve commit SHA
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_IMAGE_SHA: ${{ inputs.image_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            sha="$RUN_HEAD_SHA"
            rollback=false
          else
            # Manual runs are rollback-only and must run the main-branch
            # workflow, so production never executes unreviewed deploy tooling.
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Manual deploys must be run from main (got $GITHUB_REF)."
              exit 1
            fi
            if [ -z "$INPUT_IMAGE_SHA" ]; then
              echo "::error::Manual deploys are rollback-only: set image_sha to a previously built commit SHA."
              exit 1
            fi
            sha="$INPUT_IMAGE_SHA"
            rollback=true
          fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Deploy target must be a full 40-character lowercase commit SHA, got '$sha'."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "rollback=$rollback" >> "$GITHUB_OUTPUT"
          echo "Deploy target: $sha (rollback=$rollback)" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build image
    needs: resolve
    if: needs.resolve.outputs.rollback == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend/api
          file: backend/api/.docker/api/Dockerfile
          target: frankenphp_prod
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.resolve.outputs.sha }}

  verify-image:
    name: Verify rollback image
    needs: resolve
    if: needs.resolve.outputs.rollback == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check image exists
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ needs.resolve.outputs.sha }}
        run: |
          if ! docker manifest inspect "$IMAGE_REF" >/dev/null; then
            echo "::error::Image $IMAGE_REF was not found in GHCR. Only previously built commits can be redeployed."
            exit 1
          fi

  deploy:
    name: Deploy to production
    needs:
      - resolve
      - build
      - verify-image
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      (needs.build.result == 'success' || needs.verify-image.result == 'success')
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Deploy tooling comes from the workflow's own ref so rollbacks to commits
      # older than scripts/deploy-api-remote.sh still use the current script.
      - name: Checkout deploy tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Compose file must match the image being deployed.
      - name: Checkout deploy target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: target
          sparse-checkout: backend/api/compose.prod.yaml
          sparse-checkout-cone-mode: false
      - name: Configure SSH
        env:
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          OVH_KNOWN_HOSTS: ${{ secrets.OVH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$OVH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload production Compose file
        env:
          OVH_SSH_HOST: ${{ secrets.OVH_SSH_HOST }}
          OVH_SSH_USER: ${{ secrets.OVH_SSH_USER }}
          OVH_DEPLOY_PATH: ${{ secrets.OVH_DEPLOY_PATH }}
        run: |
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes target/backend/api/compose.prod.yaml "$OVH_SSH_USER@$OVH_SSH_HOST:$OVH_DEPLOY_PATH/compose.prod.yaml"
      - name: Migrate, deploy, probe, roll back on failure
        env:
          OVH_SSH_HOST: ${{ secrets.OVH_SSH_HOST }}
          OVH_SSH_USER: ${{ secrets.OVH_SSH_USER }}
          OVH_DEPLOY_PATH: ${{ secrets.OVH_DEPLOY_PATH }}
          OVH_ENV_FILE: ${{ secrets.OVH_ENV_FILE }}
          IMAGE_REF: ${{ env.IMAGE }}:${{ needs.resolve.outputs.sha }}
        run: |
          remote_args=$(printf '%q ' "$OVH_DEPLOY_PATH" "$OVH_ENV_FILE" "$IMAGE_REF")
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes "$OVH_SSH_USER@$OVH_SSH_HOST" \
            "bash -s -- $remote_args" < scripts/deploy-api-remote.sh
