name: Caregiver Mobile CI

on:
  push:
    branches:
      - main
    paths:
      - apps/caregiver_mobile/**
      - .github/workflows/caregiver-mobile-ci.yaml
  pull_request:
    branches:
      - main
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: caregiver-mobile-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect caregiver mobile changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- \
            apps/caregiver_mobile \
            .github/workflows/caregiver-mobile-ci.yaml; then
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Caregiver Mobile Checks
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/caregiver_mobile
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Pinned so a new floating stable release cannot break CI unnoticed.
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
          cache-dependency-path: apps/caregiver_mobile/android/**/*.gradle*

      - name: Install dependencies
        run: flutter pub get

      - name: Run deterministic quality checks
        run: make quality

      - name: Build Android APK
        run: make build-android

      # The caregiver Gradle wrapper is gitignored and generated by the
      # Flutter build above. The app has no native unit tests yet, so only
      # Android lint runs here.
      - name: Run caregiver Android lint
        working-directory: apps/caregiver_mobile/android
        run: ./gradlew :app:lintDebug

  required-quality:
    name: Caregiver Mobile Quality
    needs:
      - changes
      - quality
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify caregiver mobile result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
        run: |
          test "$CHANGES_RESULT" = "success"
          if [ "$RELEVANT" = "true" ]; then
            test "$QUALITY_RESULT" = "success"
          else
            test "$QUALITY_RESULT" = "skipped"
          fi
